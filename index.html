<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Lev — Video Editor</title>
  <meta name="description" content="Transforming ideas into vertical stories that captivate and stay." />

  <meta property="og:title" content="Lev — Video Editor" />
  <meta property="og:description" content="Transforming ideas into vertical stories that captivate and stay." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://editorlev.com/" />
  <meta name="theme-color" content="#0b0c0f" />

  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%2280%22 height=%2280%22 x=%2210%22 y=%2210%22 rx=%2220%22 fill=%22%23f5f5f7%22/></svg>"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Inter:wght@300;400;500;600;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./style.css" />
  <script src="./script.js" defer></script>
</head>

<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-ambient"></div>
    <div class="bg-grid"></div>
    <div class="bg-grid-lit" id="gridLit"></div>
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <main class="page">
    <section class="hero" id="top">
      <div class="hero-inner">
        <h1 class="main-title">
          <span class="title-top">VIDEO</span>
          <span class="accent">Editor</span>
        </h1>

        <div class="hero-divider" aria-hidden="true">
          <span class="diamond"></span>
        </div>

        <p class="sub">
          Transforming ideas into vertical stories<br />
          that captivate and stay.
        </p>

        <div class="hero-cta" role="group" aria-label="Contact links">
          <div class="row">
            <a
              class="btn"
              href="https://t.me/editor_lev"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z" />
              </svg>
              <span>Telegram</span>
            </a>

            <button
              class="btn"
              id="copyEmailBtn"
              type="button"
              data-email="editorafterwork@gmail.com"
            >
              <svg
                class="btn-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="2" y="4" width="20" height="16" rx="3" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
              <span class="btn-label" aria-live="polite">Email</span>
            </button>
          </div>

          <a
            class="btn btn-primary"
            href="https://t.me/editor_lev"
            target="_blank"
            rel="noopener noreferrer"
          >
            Hire me
          </a>
        </div>

        <a class="scroll-btn" href="#works" data-scroll="#works" aria-label="Scroll to works">
          <span>WORKS</span>
          <span class="scroll-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </span>
        </a>
      </div>
    </section>

    <section class="works" id="works" aria-label="Works">
      <div class="works-header">
        <span class="works-line" aria-hidden="true"></span>
        <h2 class="works-title">WORKS</h2>
        <span class="works-line" aria-hidden="true"></span>
      </div>

      <div class="work-grid">
        <article class="work-card">
          <div class="frame">
            <video class="work-video" playsinline preload="metadata" loop>
              <source src="./video1.mp4#t=0.001" type="video/mp4" />
              Your browser does not support video playback.
            </video>

            <button class="video-toggle" type="button" aria-label="Play video 1"></button>

            <div class="video-controls">
              <button class="video-mute" type="button" aria-label="Mute video 1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M11 5 6.5 9H3.5v6h3L11 19V5z" />
                  <path d="M15 9a4.5 4.5 0 0 1 0 6" />
                  <path d="M17.8 6.5a8 8 0 0 1 0 11" />
                </svg>
              </button>

              <input class="video-volume" type="range" min="0" max="1"
                step="0.05" value="0.5" aria-label="Volume for video 1" />
            </div>
          </div>
        </article>

        <article class="work-card">
          <div class="frame">
            <video class="work-video" playsinline preload="metadata" loop>
              <source src="./video2.mp4#t=0.001" type="video/mp4" />
              Your browser does not support video playback.
            </video>

            <button class="video-toggle" type="button" aria-label="Play video 2"></button>

            <div class="video-controls">
              <button class="video-mute" type="button" aria-label="Mute video 2">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M11 5 6.5 9H3.5v6h3L11 19V5z" />
                  <path d="M15 9a4.5 4.5 0 0 1 0 6" />
                  <path d="M17.8 6.5a8 8 0 0 1 0 11" />
                </svg>
              </button>

              <input class="video-volume" type="range" min="0" max="1"
                step="0.05" value="0.5" aria-label="Volume for video 2" />
            </div>
          </div>
        </article>

        <article class="work-card">
          <div class="frame">
            <video class="work-video" playsinline preload="metadata" loop>
              <source src="./video3.mp4#t=0.001" type="video/mp4" />
              Your browser does not support video playback.
            </video>

            <button class="video-toggle" type="button" aria-label="Play video 3"></button>

            <div class="video-controls">
              <button class="video-mute" type="button" aria-label="Mute video 3">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M11 5 6.5 9H3.5v6h3L11 19V5z" />
                  <path d="M15 9a4.5 4.5 0 0 1 0 6" />
                  <path d="M17.8 6.5a8 8 0 0 1 0 11" />
                </svg>
              </button>

              <input class="video-volume" type="range" min="0" max="1"
                step="0.05" value="0.5" aria-label="Volume for video 3" />
            </div>
          </div>

          <a
            class="mobile-back-top"
            href="#top"
            data-scroll="#top"
            aria-label="Back to top"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <path d="m18 15-6-6-6 6" />
            </svg>
          </a>
        </article>
      </div>

      <div class="works-bottom">
        <a class="back-top-btn" href="#top" data-scroll="#top" aria-label="Back to top">
          <span class="scroll-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m18 15-6-6-6 6" />
            </svg>
          </span>
          <span>BACK TO TOP</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
