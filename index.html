<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lev Editor | Portfolio</title>
    <!-- Шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- v=57.0 (обнови версию, если не видишь изменений) -->
    <link rel="stylesheet" href="style.css?v=57.0">
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1 class="main-title">
                <span class="white">Video</span>
                <span class="pink">Editor</span>
            </h1>
            <p class="tagline">Vertical high-quality stories & storytelling</p>
            
            <div class="social-links">
                <a href="https://t.me/editor_lev" target="_blank" class="social-item">
                    <i class="fab fa-telegram-plane"></i>
                </a>
                <a href="javascript:void(0)" onclick="copyEmail()" class="social-item email-btn">
                    <i class="fas fa-envelope"></i>
                    <span class="copy-tooltip" id="tooltip">Copy Email</span>
                </a>
            </div>

            <div class="action-group">
                <a href="https://t.me/editor_lev" target="_blank" class="btn-hire">Hire me</a>
            </div>
        </div>
        
        <!-- Кнопка скролла -->
        <div class="scroll-down-container">
            <a href="#portfolio" class="scroll-btn" id="scrollArrow">
                <i class="fas fa-chevron-down"></i>
            </a>
        </div>
    </section>

    <section class="portfolio" id="portfolio">
        <div class="portfolio-wrapper">
            <h2 class="section-title">My Works</h2>
            <div class="work-grid">
                <!-- Работа 1 -->
                <div class="work-card">
                    <video class="portfolio-video" muted loop playsinline preload="metadata">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                    <div class="video-controls">
                        <button class="mute-btn"><i class="fas fa-volume-mute"></i></button>
                    </div>
                </div>
                <!-- Работа 2 -->
                <div class="work-card">
                    <video class="portfolio-video" muted loop playsinline preload="metadata">
                        <source src="video2.mp4" type="video/mp4">
                    </video>
                    <div class="video-controls">
                        <button class="mute-btn"><i class="fas fa-volume-mute"></i></button>
                    </div>
                </div>
                <!-- Работа 3 -->
                <div class="work-card">
                    <video class="portfolio-video" muted loop playsinline preload="metadata">
                        <source src="video3.mp4" type="video/mp4">
                    </video>
                    <div class="video-controls">
                        <button class="mute-btn"><i class="fas fa-volume-mute"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // ГАРАНТИРОВАННО ПЛАВНЫЙ СКРОЛЛ
        document.getElementById('scrollArrow').addEventListener('click', function(e) {
            e.preventDefault();
            const target = document.querySelector('#portfolio');
            window.scrollTo({
                top: target.offsetTop,
                behavior: 'smooth'
            });
        });

        // Копирование Email
        function copyEmail() {
            const email = "editorafterwork@gmail.com";
            const tooltip = document.getElementById("tooltip");
            navigator.clipboard.writeText(email).then(() => {
                tooltip.innerText = "Copied!";
                tooltip.classList.add('copied-active');
                setTimeout(() => {
                    tooltip.classList.remove('copied-active');
                    setTimeout(() => { tooltip.innerText = "Copy Email"; }, 300);
                }, 2000);
            });
        }

        // Логика видео
        document.querySelectorAll('.work-card').forEach(card => {
            const video = card.querySelector('video');
            const muteBtn = card.querySelector('.mute-btn');
            card.addEventListener('mouseenter', () => video.play());
            card.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                video.muted = !video.muted;
                muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            });
        });
    </script>
</body>
</html>
