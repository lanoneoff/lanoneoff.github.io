<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070304" />
  <title>Video Editor — vertical stories</title>

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= ГЛАВНЫЙ ЭКРАН ================= -->
  <header class="hero">
    <div class="hero__bg"></div>
    <div class="hero__overlay"></div>

    <div class="hero__content">
      <h1 class="hero__title">
        Video
        <span class="hero__title-accent">Editor</span>
      </h1>

      <div class="hero__divider"></div>

      <p class="hero__subtitle">
        Transforming ideas into vertical stories that captivate and stay.
      </p>

      <div class="hero__buttons">
        <!-- ЗАМЕНИ ссылку на свой телеграм -->
        <a href="https://t.me/ваш_ник" class="btn btn--ghost" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
          </svg>
          Telegram
        </a>

        <!-- ЗАМЕНИ на свою почту -->
        <a href="mailto:your@email.com" class="btn btn--ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
          Email
        </a>
      </div>

      <!-- Кнопка Hire me -->
      <a href="https://t.me/ваш_ник" class="btn btn--primary" target="_blank" rel="noopener">
        Hire me
      </a>
    </div>

    <!-- Индикатор WORKS (стрелка вниз) -->
    <a href="#works" class="hero__works" aria-label="Scroll to works">
      <span>Works</span>
      <span class="hero__works-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </span>
    </a>
  </header>

  <!-- ================= СЕКЦИЯ WORKS ================= -->
  <section class="works" id="works">
    <h2 class="works__title">Works</h2>

    <div class="works__grid">

      <!-- Карточка 1 -->
      <article class="card">
        <div class="card__media">
          <!-- ЗАМЕНИ src на свою картинку/видео -->
          <!-- Для видео используй:
               <video src="works/video-1.mp4" autoplay muted loop playsinline></video>
               Для YouTube Shorts:
               <iframe src="https://www.youtube.com/embed/ID" allowfullscreen></iframe>
          -->
          <img src="works/work-1.jpg" alt="Project 1" />
        </div>
        <p class="card__caption">Video Editor</p>
      </article>

      <!-- Карточка 2 -->
      <article class="card">
        <div class="card__media">
          <img src="works/work-2.jpg" alt="Project 2" />
        </div>
        <p class="card__caption">Video Editor</p>
      </article>

    </div>
  </section>

  <!-- Кнопка «наверх» -->
  <a href="#top" class="to-top" aria-label="Back to top" id="top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M12 19V5"/>
      <path d="m5 12 7-7 7 7"/>
    </svg>
  </a>

</body>
</html>
