<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lev | Video Editor</title>
    <meta name="description" content="Professional Video Editor Portfolio">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-vignette"></div>

    <section class="hero">
        <div class="hero-container">
                    <h1 class="main-title">
                <span class="white">Video</span>
                <span class="accent">Editor</span>
            </h1>
            <p class="tagline">Transforming ideas into high-quality vertical stories<br>that captivate audiences and leave a lasting impression</p>
            <div class="social-links">
                <a href="https://t.me/editor_lev" target="_blank" class="social-item social-tg">
                    <i class="fab fa-telegram-plane"></i>
                    <span>Telegram</span>
                </a>
                <button class="social-item email-btn social-email" onclick="copyEmail()">
                    <i class="fas fa-envelope"></i>
                    <span id="emailText">Email</span>
                </button>
            </div>
            <a href="https://t.me/editor_lev" target="_blank" class="btn-hire btn-hire-delayed">Hire me</a>
        </div>
        <a href="#portfolio" class="scroll-indicator" id="scrollArrow">
            <i class="fas fa-chevron-down"></i>
        </a>
    </section>

    <section class="portfolio" id="portfolio">
        <div class="portfolio-wrapper">
            <h2 class="section-title">My Works</h2>
            <div class="work-grid">
                <article class="work-card">
                    <video class="portfolio-video" muted loop playsinline preload="metadata">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                    <div class="video-controls">
                        <input type="range" class="volume-slider muted" min="0" max="1" step="0.01" value="0">
                        <button class="mute-btn muted">
                            <i class="fas fa-volume-mute"></i>
                        </button>
                    </div>
                </article>

                <article class="work-card">
                    <video class="portfolio-video" muted loop playsinline preload="metadata">
                        <source src="video2.mp4" type="video/mp4">
                    </video>
                    <div class="video-controls">
                        <input type="range" class="volume-slider muted" min="0" max="1" step="0.01" value="0">
                        <button class="mute-btn muted">
                            <i class="fas fa-volume-mute"></i>
                        </button>
                    </div>
                </article>

                <article class="work-card">
                    <video class="portfolio-video" muted loop playsinline preload="metadata">
                        <source src="video3.mp4" type="video/mp4">
                    </video>
                    <div class="video-controls">
                        <input type="range" class="volume-slider muted" min="0" max="1" step="0.01" value="0">
                        <button class="mute-btn muted">
                            <i class="fas fa-volume-mute"></i>
                        </button>
                    </div>
                </article>
            </div>
        </div>
    </section>

    <script>
        function copyEmail() {
            navigator.clipboard.writeText("editorafterwork@gmail.com");
            const emailText = document.getElementById("emailText");
            if (emailText) {
                emailText.textContent = "Copied!";
                setTimeout(() => { emailText.textContent = "Email"; }, 2000);
            }
        }

        document.getElementById("scrollArrow").addEventListener("click", e => {
            e.preventDefault();
            document.getElementById("portfolio").scrollIntoView({ behavior: "smooth" });
        });

        document.querySelectorAll(".work-card").forEach(card => {
            const video = card.querySelector("video");
            const muteBtn = card.querySelector(".mute-btn");
            const volumeSlider = card.querySelector(".volume-slider");

            card.addEventListener("mouseenter", () => {
                video.muted = false;
                video.volume = 0.5;
                volumeSlider.value = 0.5;
                volumeSlider.classList.remove('muted');
                muteBtn.classList.remove('muted');
                muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                video.play();
            });

            card.addEventListener("mouseleave", () => {
                video.pause();
                video.currentTime = 0;
                video.muted = true;
                volumeSlider.value = 0;
                volumeSlider.classList.add('muted');
                muteBtn.classList.add('muted');
                muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
            });

            // Mobile tap
            card.addEventListener("touchstart", (e) => {
                if (e.target.closest('.mute-btn') || e.target.closest('.volume-slider')) return;

                // Pause other cards
                document.querySelectorAll(".work-card").forEach(otherCard => {
                    if (otherCard !== card) {
                        const otherVideo = otherCard.querySelector("video");
                        const otherSlider = otherCard.querySelector(".volume-slider");
                        const otherMuteBtn = otherCard.querySelector(".mute-btn");
                        if (otherVideo && !otherVideo.paused) {
                            otherVideo.pause();
                            otherVideo.currentTime = 0;
                            otherVideo.muted = true;
                            if (otherSlider) {
                                otherSlider.value = 0;
                                otherSlider.classList.add('muted');
                            }
                            if (otherMuteBtn) {
                                otherMuteBtn.classList.add('muted');
                                otherMuteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                            }
                        }
                    }
                });

                video.muted = false;
                video.volume = 0.5;
                volumeSlider.value = 0.5;
                volumeSlider.classList.remove('muted');
                muteBtn.classList.remove('muted');
                muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                video.play().catch(() => {});
            }, { passive: true });

            muteBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                video.muted = !video.muted;
                if (video.muted) {
                    muteBtn.classList.add('muted');
                    muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                    volumeSlider.value = 0;
                    volumeSlider.classList.add('muted');
                } else {
                    muteBtn.classList.remove('muted');
                    muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                    volumeSlider.value = 0.5;
                    video.volume = 0.5;
                    volumeSlider.classList.remove('muted');
                }
            });

            volumeSlider.addEventListener("input", (e) => {
                e.stopPropagation();
                const volume = parseFloat(e.target.value);
                video.volume = volume;
                if (volume === 0) {
                    video.muted = true;
                    muteBtn.classList.add('muted');
                    muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                    volumeSlider.classList.add('muted');
                } else {
                    video.muted = false;
                    muteBtn.classList.remove('muted');
                    muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                    volumeSlider.classList.remove('muted');
                }
            });
        });
    </script>
</body>
</html>
