              <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
              </svg>

            </a>

            <button class="btn" id="copyEmailBtn" type="button" data-email="editorafterwork@gmail.com">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

      <div class="work-grid">

        <!-- Video 1 -->

        <!-- Video 2 -->
        <article class="work-card">
          <div class="frame">

            </video>
            
            <div class="video-overlay">
              <div class="play-indicator">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </div>
              
              <div class="sound-pill">
                <button class="mute-btn" type="button" aria-label="Toggle Mute">

        <!-- Video 3 -->
        <article class="work-card">
          <div class="frame">
            <video class="work-video" playsinline preload="metadata" loop>
              <source src="./video3.mp4#t=0.001" type="video/mp4" />
            </video>
            
            <div class="video-overlay">
              <div class="play-indicator">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </div>
              
              <div class="sound-pill">
                <button class="mute-btn" type="button" aria-label="Toggle Mute">
                  <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor"></svg>
                </button>
                <div class="slider-container">
                  <input type="range" class="vol-slider" min="0" max="1" step="0.02" value="0.5" aria-label="Volume">

      <div class="works-bottom">
        <a class="back-top-btn" href="#top" data-scroll="#top" aria-label="Back to top">
          <span class="scroll-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m18 15-6-6-6 6"/>

          <span class="scroll-text">BACK TO TOP</span>

  <script>
    // Copy Email (with fallback for mobile HTTP testing)
    const emailBtn = document.getElementById('copyEmailBtn');
    if (emailBtn) {
      const label = emailBtn.querySelector('.btn-label');
      let copyTimeout;

      function showCopiedFeedback() {
        clearTimeout(copyTimeout);
        if (label) label.innerText = 'Copied!';
        emailBtn.classList.add('copied');
        copyTimeout = setTimeout(() => {
          if (label) label.innerText = 'Email';
          emailBtn.classList.remove('copied');
        }, 2000);
      }

      emailBtn.addEventListener('click', () => {
        const email = emailBtn.getAttribute('data-email');
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(email).then(showCopiedFeedback);
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = email;
          textArea.style.position = 'fixed';
          textArea.style.opacity = '0';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          try {
            document.execCommand('copy');
            showCopiedFeedback();
          } catch (err) {}
          document.body.removeChild(textArea);
        }
      });
    }

    const cards = Array.from(document.querySelectorAll('.work-card'));

    // Helper: center a specific card on screen
    function scrollCardToCenter(card) {
      if (!card) return;
      const rect = card.getBoundingClientRect();
      const targetY = window.scrollY + rect.top - (window.innerHeight - rect.height) / 2;
      window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
    }

    // Smart Smooth Scroll for #works (centers 1st video on mobile) and #top
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-scroll]');
      if (!btn) return;
      const selector = btn.getAttribute('data-scroll');

      if (selector === '#top') {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (selector === '#works') {
        e.preventDefault();
        const isMobile = window.matchMedia('(max-width: 720px)').matches;
        const firstCard = cards[0];
        const worksSection = document.querySelector('#works');

        if (isMobile && firstCard) {
          scrollCardToCenter(firstCard);
        } else if (worksSection) {
          worksSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });

    // Mobile Swipe Snap Assist: гарантирует ровную доводку ко 2-му и 3-му видео во всех мобильных браузерах
    (function initMobileSnapAssist() {
      let userTouched = false;
      let startScrollY = 0;
      let startCardIndex = -1;
      let scrollTimer = null;

      function getClosestCardIndex() {
        const viewCenter = window.innerHeight / 2;
        let bestIdx = 0;
        let minDist = Infinity;
        cards.forEach((card, idx) => {
          const rect = card.getBoundingClientRect();
          const cardCenter = rect.top + rect.height / 2;
          const dist = Math.abs(cardCenter - viewCenter);
          if (dist < minDist) {
            minDist = dist;
            bestIdx = idx;
          }
        });
        return { index: bestIdx, distance: minDist };
      }

      window.addEventListener('touchstart', () => {
        if (!window.matchMedia('(max-width: 720px)').matches) return;
        userTouched = true;
        startScrollY = window.scrollY;
        const closest = getClosestCardIndex();
        startCardIndex = closest.distance < window.innerHeight * 0.45 ? closest.index : -1;
        clearTimeout(scrollTimer);
      }, { passive: true });

      function onScrollCheck() {
        if (!userTouched || !window.matchMedia('(max-width: 720px)').matches) return;
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          if (!userTouched) return;
          userTouched = false;

          // Если мы наверху в Hero-секции — не тянем вниз
          if (window.scrollY < window.innerHeight * 0.45) return;

          const deltaY = window.scrollY - startScrollY;
          const closest = getClosestCardIndex();
          let targetIdx = closest.index;

          // Если свайпнули с карточки вверх или вниз, переключаем на следующую/предыдущую
          if (startCardIndex !== -1 && Math.abs(deltaY) > 45) {
            if (deltaY > 0 && closest.index === startCardIndex) {
              targetIdx = Math.min(cards.length - 1, startCardIndex + 1);
            } else if (deltaY < 0 && closest.index === startCardIndex) {
              if (startCardIndex === 0) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
              }
              targetIdx = Math.max(0, startCardIndex - 1);
            }
          }

          const targetCard = cards[targetIdx];
          if (!targetCard) return;

          const rect = targetCard.getBoundingClientRect();
          const offsetFromCenter = Math.abs((rect.top + rect.height / 2) - (window.innerHeight / 2));

          // Доводим плавно в центр, если карточка остановилась не ровно по центру
          if (offsetFromCenter > 6) {
            scrollCardToCenter(targetCard);
          }
        }, 110);
      }

      window.addEventListener('scroll', onScrollCheck, { passive: true });
      window.addEventListener('touchend', onScrollCheck, { passive: true });
    })();

    // Cursor Light & Interactive Grid Illumination (Desktop only)
    const cursorGlow = document.getElementById('cursorGlow');
    const gridLit = document.getElementById('gridLit');
    const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    if (canHover) {
      window.addEventListener('pointermove', (e) => {
        const x = `${e.clientX}px`;
        const y = `${e.clientY}px`;
        if (cursorGlow) {
          cursorGlow.style.setProperty('--mx', x);
          cursorGlow.style.setProperty('--my', y);
        }
        if (gridLit) {
          gridLit.style.setProperty('--mx', x);
          gridLit.style.setProperty('--my', y);
        }
      }, { passive: true });
    }

    // Volume Icons
    const ICONS = {
      mute: '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>',
      low: '<path d="M7 9v6h4l5 5V4l-5 5H7z"/>',
      med: '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>',
      high: '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>'
    };

    const DEFAULT_VOLUME = 0.5;

    function pauseCard(card, resetTime = false) {
      card.dataset.wantPlay = 'false';
      const v = card.querySelector('.work-video');
      if (!v) return;
      v.pause();
      if (resetTime) v.currentTime = 0;
      card.classList.remove('is-playing');
    }

    function pauseAllExcept(activeCard) {
      cards.forEach(c => {
        if (c !== activeCard) pauseCard(c, false);
      });
    }

    cards.forEach((card) => {
      const video = card.querySelector('.work-video');
      const muteBtn = card.querySelector('.mute-btn');
      const volIcon = card.querySelector('.vol-icon');
      const volSlider = card.querySelector('.vol-slider');
      const soundPill = card.querySelector('.sound-pill');

      if (!video) return;

      let lastVolume = DEFAULT_VOLUME;
      let soundEnabled = true; // По умолчанию звук включён
      video.volume = DEFAULT_VOLUME;
      video.muted = false;
      card.dataset.wantPlay = 'false';

      function getRestoredVolume() {
        return lastVolume > 0 ? lastVolume : DEFAULT_VOLUME;
      }

      function syncVolumeUI() {
        const effVol = (!soundEnabled || video.muted) ? 0 : video.volume;
        volSlider.value = effVol;
        volSlider.style.setProperty('--val', `${effVol * 100}%`);

        if (effVol === 0) {
          volIcon.innerHTML = ICONS.mute;
          soundPill.classList.add('is-muted');
        } else {
          soundPill.classList.remove('is-muted');
          if (effVol < 0.33) volIcon.innerHTML = ICONS.low;
          else if (effVol < 0.66) volIcon.innerHTML = ICONS.med;
          else volIcon.innerHTML = ICONS.high;
        }
      }

      syncVolumeUI();

      function playCard(withSound = soundEnabled) {
        pauseAllExcept(card);
        card.dataset.wantPlay = 'true';
        soundEnabled = Boolean(withSound);

        if (soundEnabled) {
          video.volume = getRestoredVolume();
          video.muted = false;
        } else {
          video.muted = true;
        }
        syncVolumeUI();

        const p = video.play();
        if (p !== undefined) {
          p.then(() => {
            if (card.dataset.wantPlay !== 'true') {
              video.pause();
              return;
            }
            card.classList.add('is-playing');
            syncVolumeUI();
          }).catch((err) => {
            if (card.dataset.wantPlay !== 'true' || err.name === 'AbortError') return;
            video.muted = true;
            syncVolumeUI();
            video.play().then(() => {
              if (card.dataset.wantPlay !== 'true') {
                video.pause();
                return;
              }
              card.classList.add('is-playing');
            }).catch(() => {});
          });
        }
      }

      volSlider.addEventListener('input', (e) => {
        e.stopPropagation();
        const val = parseFloat(e.target.value);
        video.volume = val;
        if (val > 0) {
          soundEnabled = true;
          video.muted = false;
        } else {
          soundEnabled = false;
          video.muted = true;
        }
        syncVolumeUI();
      });

      volSlider.addEventListener('change', (e) => {
        e.stopPropagation();
        const val = parseFloat(e.target.value);
        if (val > 0) {
          lastVolume = val;
        }
      });

      muteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!soundEnabled || video.muted || video.volume === 0) {
          soundEnabled = true;
          video.volume = getRestoredVolume();
          video.muted = false;
        } else {
          if (video.volume > 0) {
            lastVolume = video.volume;
          }
          soundEnabled = false;
          video.muted = true;
        }
        syncVolumeUI();
      });

      soundPill.addEventListener('click', (e) => e.stopPropagation());

      card.querySelector('.frame').addEventListener('click', () => {
        if (video.paused) {
          playCard(soundEnabled);
        } else if (canHover && soundEnabled && video.muted) {
          video.volume = getRestoredVolume();
          video.muted = false;
          syncVolumeUI();
        } else {
          pauseCard(card, false);
        }
      });

      if (canHover) {
        card.addEventListener('mouseenter', () => {
          playCard(soundEnabled);
        });
        card.addEventListener('mouseleave', () => {
          pauseCard(card, true);
        });
      }
    });

    // Авто-пауза, когда видео уходит с экрана при скролле
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          const card = entry.target;
          if (!entry.isIntersecting || entry.intersectionRatio < 0.25) {
            pauseCard(card, false);
          }
        });
      }, { threshold: [0.25] });

      cards.forEach((card) => observer.observe(card));
    }
  </script>
