<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lev | Video Editor</title>
    <meta name="description" content="Professional Video Editor Portfolio">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-vignette"></div>

    <section class="hero">
        <div class="hero-container">
                    <h1 class="main-title">
                <span class="white">Video</span>
                <span class="accent">Editor</span>
            </h1>
            <p class="tagline">Transforming ideas into high-quality vertical stories<br>that captivate audiences and leave a lasting impression</p>
            <div class="social-links">
                <a href="https://t.me/editor_lev" target="_blank" class="social-item social-tg">
                    <i class="fab fa-telegram-plane"></i>
                    <span>Telegram</span>
                </a>
                <button class="social-item email-btn social-email" onclick="copyEmail()">
                    <i class="fas fa-envelope"></i>
                    <span id="emailText">Email</span>
                </button>
            </div>
            <a href="https://t.me/editor_lev" target="_blank" class="btn-hire btn-hire-delayed">Hire me</a>
        </div>
        <a href="#portfolio" class="scroll-indicator" id="scrollArrow">
            <i class="fas fa-chevron-down"></i>
        </a>
    </section>

    <section class="portfolio" id="portfolio">
        <div class="portfolio-wrapper">
            <h2 class="section-title">My Works</h2>
            <div class="work-grid">
                <article class="work-card">
                    <video class="portfolio-video" muted loop playsinline preload="metadata">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                    <div class="video-controls">
                        <input type="range" class="volume-slider muted" min="0" max="1" step="0.01" value="0">
                        <button class="mute-btn">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                        </button>
                    </div>
                </article>

                <article class="work-card">
                    <video class="portfolio-video" muted loop playsinline preload="metadata">
                        <source src="video2.mp4" type="video/mp4">
                    </video>
                    <div class="video-controls">
                        <input type="range" class="volume-slider muted" min="0" max="1" step="0.01" value="0">
                        <button class="mute-btn">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                        </button>
                    </div>
                </article>

                <article class="work-card">
                    <video class="portfolio-video" muted loop playsinline preload="metadata">
                        <source src="video3.mp4" type="video/mp4">
                    </video>
                    <div class="video-controls">
                        <input type="range" class="volume-slider muted" min="0" max="1" step="0.01" value="0">
                        <button class="mute-btn">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                        </button>
                    </div>
                </article>
            </div>
        </div>
    </section>

    <script>
        function copyEmail() {
            navigator.clipboard.writeText("editorafterwork@gmail.com");
            const emailText = document.getElementById("emailText");
            if (emailText) {
                emailText.textContent = "Copied!";
                setTimeout(() => { emailText.textContent = "Email"; }, 2000);
            }
        }

        document.getElementById("scrollArrow").addEventListener("click", e => {
            e.preventDefault();
            document.getElementById("portfolio").scrollIntoView({ behavior: "smooth" });
        });

        document.querySelectorAll(".work-card").forEach(card => {
            const video = card.querySelector("video");
            const muteBtn = card.querySelector(".mute-btn");
            const volumeSlider = card.querySelector(".volume-slider");
            const controls = card.querySelector(".video-controls");

            let isMuted = true;

            function updateSliderFill() {
                const val = volumeSlider.value;
                const pct = val * 100;
                volumeSlider.style.background = `linear-gradient(to right, rgba(255,255,255,0.6) ${pct}%, rgba(255,255,255,0.12) ${pct}%)`;
            }

            function setMuted(muted) {
                isMuted = muted;
                video.muted = muted;
                if (muted) {
                    controls.classList.add('muted');
                    volumeSlider.classList.add('muted');
                    muteBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
                } else {
                    controls.classList.remove('muted');
                    volumeSlider.classList.remove('muted');
                    muteBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
                }
            }

            // Desktop hover
            card.addEventListener("mouseenter", () => {
                video.volume = 0.5;
                volumeSlider.value = 0.5;
                setMuted(false);
                updateSliderFill();
                video.play();
            });

            card.addEventListener("mouseleave", () => {
                video.pause();
                video.currentTime = 0;
                volumeSlider.value = 0;
                setMuted(true);
                updateSliderFill();
            });

            // Mobile tap — touch + click card to play
            function playCard() {
                // Pause all other cards
                document.querySelectorAll(".work-card").forEach(otherCard => {
                    if (otherCard !== card) {
                        const otherVideo = otherCard.querySelector("video");
                        const otherSlider = otherCard.querySelector(".volume-slider");
                        const otherControls = otherCard.querySelector(".video-controls");
                        const otherMuteBtn = otherCard.querySelector(".mute-btn");
                        if (otherVideo && !otherVideo.paused) {
                            otherVideo.pause();
                            otherVideo.currentTime = 0;
                            if (otherSlider) {
                                otherSlider.value = 0;
                                otherSlider.classList.add('muted');
                                otherSlider.style.background = 'rgba(255,255,255,.2)';
                            }
                            if (otherControls) otherControls.classList.add('muted');
                            if (otherMuteBtn) {
                                otherMuteBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
                            }
                        }
                    }
                });

                video.volume = 0.5;
                volumeSlider.value = 0.5;
                setMuted(false);
                updateSliderFill();
                video.play().catch(() => {});
            }

            card.addEventListener("touchstart", (e) => {
                if (e.target.closest('.mute-btn') || e.target.closest('.volume-slider')) return;
                playCard();
            }, { passive: true });

            card.addEventListener("click", (e) => {
                // Ignore clicks on controls
                if (e.target.closest('.mute-btn') || e.target.closest('.volume-slider')) return;

                if (e.target.closest('.mute-btn') || e.target.closest('.volume-slider')) return;
                playCard();
            });

            // Prevent clicks on controls from bubbling to card
            muteBtn.addEventListener("click", (e) => {
                e.stopPropagation();
            });

            muteBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                if (isMuted) {
                    video.volume = 0.5;
                    volumeSlider.value = 0.5;
                    setMuted(false);
                } else {
                    volumeSlider.value = 0;
                    setMuted(true);
                }
                updateSliderFill();
            });

            volumeSlider.addEventListener("input", (e) => {
                e.stopPropagation();
                const volume = parseFloat(e.target.value);
                video.volume = volume;
                if (volume === 0) {
                    setMuted(true);
                } else {
                    setMuted(false);
                }
                updateSliderFill();
            });
        });
    </script>
</body>
</html>
