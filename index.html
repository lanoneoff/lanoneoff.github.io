<!DOCTYPE html>

<body>

<div class="embers" aria-hidden="true">

  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span>

<section class="hero">
  <div class="hero-inner">
    <h1 class="main-title">
      <span class="white fade" style="--d:.1s">Video</span>
      <span class="accent fade" style="--d:.25s">Editor</span>

    <div class="hero-cta fade" style="--d:.55s">
      <p class="tagline">
        Transforming ideas into vertical stories<br>
        that captivate and stay.
      </p>
      <div class="row">
        <a href="https://t.me/editor_lev" target="_blank" class="btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.07-.75 4.19-1.82 6.98-3.02 8.38-3.6 3.98-1.66 4.81-1.95 5.35-1.96.12 0 .38.03.55.17.14.12.18.3.2.43-.02.07-.01.21-.03.38z"/></svg>
          <span>Telegram</span>
        </a>
        <button class="btn" type="button" onclick="copyEmail(this)">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Email</span>
        </button>

  <a href="#works" class="scroll-btn" id="scrollArrow" aria-label="Scroll to works">

    </span>

<section class="works" id="works">
  <h2 class="section-title">Works</h2>
  <div class="work-grid">

    <article class="work-card">
      <div class="frame">
        <video class="portfolio-video" muted loop playsinline preload="metadata">
          <source src="./video1.mp4" type="video/mp4">
        </video>
        <div class="play-hint">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <div class="video-controls">
          <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0" aria-label="Volume">
          <button class="mute-btn" type="button" aria-label="Mute"></button>
        </div>
      </div>
    </article>

    <article class="work-card">
      <div class="frame">
        <video class="portfolio-video" muted loop playsinline preload="metadata">
          <source src="./video2.mp4" type="video/mp4">
        </video>
        <div class="play-hint">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <div class="video-controls">
          <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0" aria-label="Volume">
          <button class="mute-btn" type="button" aria-label="Mute"></button>
        </div>
      </div>
    </article>

    <article class="work-card">
      <div class="frame">
        <video class="portfolio-video" muted loop playsinline preload="metadata">
          <source src="./video3.mp4" type="video/mp4">
        </video>
        <div class="play-hint">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <div class="video-controls">
          <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0" aria-label="Volume">
          <button class="mute-btn" type="button" aria-label="Mute"></button>
        </div>
      </div>
    </article>

  </div>
</section>

<script>
  function copyEmail(btn){
    navigator.clipboard.writeText('editorafterwork@gmail.com');
    const s = btn.querySelector('span'), old = s.textContent;
    s.textContent = 'Copied!';
    setTimeout(() => s.textContent = old, 1800);
  }

  document.getElementById('scrollArrow').addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('works').scrollIntoView({ behavior: 'smooth' });
  });

  const canHover = matchMedia('(hover:hover) and (pointer:fine)').matches;

  const glow = document.getElementById('cursorGlow');
  if (canHover && glow) {
    window.addEventListener('mousemove', e => {
      glow.style.transform = `translate3d(${e.clientX - 150}px, ${e.clientY - 150}px, 0)`;
    });
  }

  const ICON_MUTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
  const ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';

  const cards = [...document.querySelectorAll('.work-card')];

  cards.forEach(card => {
    const video  = card.querySelector('video');
    const slider = card.querySelector('.volume-slider');
    const mute   = card.querySelector('.mute-btn');
    const frame  = card.querySelector('.frame');

    let progressBar = frame.querySelector('.video-progress span');
    if (!progressBar) {
      const bar = document.createElement('div');
      bar.className = 'video-progress';
      bar.innerHTML = '<span></span>';
      frame.appendChild(bar);
      progressBar = bar.querySelector('span');
    }

    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        progressBar.style.width = ((video.currentTime / video.duration) * 100) + '%';
      }
    });

    const paint = () => {
      const p = slider.value * 100;
      slider.style.background = `linear-gradient(to right,#ffffff ${p}%,rgba(255,255,255,.18) ${p}%)`;
    };
    const setMuted = m => {
      video.muted = m;
      card.classList.toggle('muted', m);
      mute.innerHTML = m ? ICON_MUTED : ICON_SOUND;
      slider.value = m ? 0 : (video.volume || .5);
      paint();
    };
    const play = sound => {
      cards.forEach(c => c !== card && c._stop());
      video.volume = .5;
      setMuted(!sound);
      card.classList.add('active');
      const promise = video.play();
      if (promise !== undefined) {
        promise.catch(() => {
          setMuted(true);
          video.play().catch(() => {});
        });
      }
    };
    const stop = () => {
      video.pause();
      video.currentTime = 0;
      setMuted(true);
      card.classList.remove('active');
      if (progressBar) progressBar.style.width = '0%';
    };
    card._stop = stop;
    card._playMuted = () => play(false);
    setMuted(true);

    if (canHover) {
      card.addEventListener('mouseenter', () => play(true));
      card.addEventListener('mouseleave', stop);
    } else {
      card.addEventListener('click', e => {
        if (e.target.closest('.video-controls')) return;
        if (video.paused) play(true); else setMuted(!video.muted);
      });
    }

    mute.addEventListener('click', e => {
      e.stopPropagation();
      setMuted(!video.muted);
    });
    slider.addEventListener('input', e => {
      e.stopPropagation();
      const v = +e.target.value;
      video.volume = v;
      video.muted = v === 0;
      card.classList.toggle('muted', v === 0);
      mute.innerHTML = v === 0 ? ICON_MUTED : ICON_SOUND;
      paint();
    });
  });

  const vis = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) en.target._stop();
      else if (!canHover && en.intersectionRatio >= .6) en.target._playMuted();
    });
  }, { threshold: [.1, .6] });
  cards.forEach(c => vis.observe(c));

  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { threshold: .15 });
  document.querySelectorAll('.work-card, .works .section-title').forEach(el => {
    el.classList.add('reveal');
    io.observe(el);
  });
</script>
</body>
</html>
