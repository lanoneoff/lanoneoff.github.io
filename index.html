<body>

<!-- ===== HERO ===== -->
<section class="hero">
  <div class="hero-inner">
    <h1 class="main-title">
      <span class="white fade" style="--d:.1s">Video</span>

    <div class="hero-cta fade" style="--d:.55s">
      <p class="tagline">
        Transforming ideas into vertical stories<br>
        that captivate and stay.
      </p>
      <div class="row">
        <a href="https://t.me/editor_lev" target="_blank" rel="noreferrer" class="btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.07-.75 4.19-1.82 6.98-3.02 8.38-3.6 3.98-1.66 4.81-1.95 5.35-1.96.12 0 .38.03.55.17.14.12.18.3.2.43-.02.07-.01.21-.03.38z"/></svg>
          <span>Telegram</span>

          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Email</span>

    </span>

<!-- ===== WORKS ===== -->
<section class="works" id="works">
  <h2 class="section-title">Works</h2>
  <div class="work-grid">

    <article class="work-card">
      <div class="frame">
        <video class="portfolio-video" muted loop playsinline preload="metadata">
          <source src="./video1.mp4" type="video/mp4">
        </video>
        <div class="play-hint">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <div class="video-controls">
          <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0" aria-label="Volume">
          <button class="mute-btn" type="button" aria-label="Mute"></button>
        </div>
        <div class="video-progress"><span></span></div>
      </div>
    </article>

    <article class="work-card">
      <div class="frame">
        <video class="portfolio-video" muted loop playsinline preload="metadata">
          <source src="./video2.mp4" type="video/mp4">
        </video>
        <div class="play-hint">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <div class="video-controls">
          <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0" aria-label="Volume">
          <button class="mute-btn" type="button" aria-label="Mute"></button>
        </div>
        <div class="video-progress"><span></span></div>
      </div>
    </article>

    <article class="work-card">
      <div class="frame">
        <video class="portfolio-video" muted loop playsinline preload="metadata">
          <source src="./video3.mp4" type="video/mp4">
        </video>
        <div class="play-hint">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <div class="video-controls">
          <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0" aria-label="Volume">
          <button class="mute-btn" type="button" aria-label="Mute"></button>
        </div>
        <div class="video-progress"><span></span></div>
      </div>
    </article>

  </div>
</section>

<script>
/* ===== COPY EMAIL ===== */
function copyEmail(btn) {
  var email = 'editorafterwork@gmail.com';
  var s = btn.querySelector('span');
  var old = s.textContent;

  var copied = false;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(email).then(function() {
      s.textContent = 'Copied!';
      setTimeout(function() { s.textContent = old; }, 1800);
    }).catch(fallback);
  } else {
    fallback();
  }

  function fallback() {
    try {
      var ta = document.createElement('textarea');
      ta.value = email;
      ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      copied = true;
    } catch(e) {}
    if (copied) {
      s.textContent = 'Copied!';
      setTimeout(function() { s.textContent = old; }, 1800);
    }
  }
}

/* ===== SMOOTH SCROLL ===== */
document.getElementById('scrollArrow').addEventListener('click', function(e) {
  e.preventDefault();
  if (window.innerWidth <= 768) {
    var firstCard = document.querySelector('.work-card');
    if (firstCard) {
      firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } else {
    document.getElementById('works').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

/* ===== DEVICE CAPABILITY ===== */
var canHover = matchMedia('(hover:hover) and (pointer:fine)').matches;

/* ===== CURSOR GLOW ===== */
var glow = document.getElementById('cursorGlow');
if (canHover && glow) {
  var raf = 0, gx = -400, gy = -400;
  window.addEventListener('mousemove', function(e) {
    gx = e.clientX - 150;
    gy = e.clientY - 150;
    if (!raf) {
      raf = requestAnimationFrame(function() {
        glow.style.transform = 'translate3d(' + gx + 'px,' + gy + 'px,0)';
        raf = 0;
      });
    }
  }, { passive: true });
} else if (glow) {
  glow.style.display = 'none';
}

/* ===== ICONS ===== */
var ICON_MUTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
var ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';

/* ===== VIDEO CARDS ===== */
var cards = [].slice.call(document.querySelectorAll('.work-card'));

cards.forEach(function(card) {
  var video  = card.querySelector('video');
  var slider = card.querySelector('.volume-slider');
  var mute   = card.querySelector('.mute-btn');
  var frame  = card.querySelector('.frame');
  var progressBar = card.querySelector('.video-progress span');

  video.addEventListener('timeupdate', function() {
    if (video.duration) {
      progressBar.style.width = ((video.currentTime / video.duration) * 100) + '%';
    }
  });

  var paint = function() {
    var p = slider.value * 100;
    slider.style.background = 'linear-gradient(to right,#ffffff ' + p + '%,rgba(255,255,255,.18) ' + p + '%)';
  };

  var setMuted = function(m) {
    video.muted = m;
    card.classList.toggle('muted', m);
    mute.innerHTML = m ? ICON_MUTED : ICON_SOUND;
    slider.value = m ? 0 : (video.volume || .5);
    paint();
  };

  var play = function(sound) {
    cards.forEach(function(c) { if (c !== card) c._stop(); });
    video.volume = .5;
    setMuted(!sound);
    card.classList.add('active');
    card.classList.remove('paused');
    var promise = video.play();
    if (promise !== undefined) {
      promise.catch(function() {
        setMuted(true);
        video.play().catch(function() {
          card.classList.remove('active');
        });
      });
    }
  };

  var stop = function() {
    video.pause();
    try { video.currentTime = 0; } catch(e) {}
    setMuted(true);
    card.classList.remove('active');
    card.classList.remove('paused');
    progressBar.style.width = '0%';
  };

  var pause = function() {
    video.pause();
    card.classList.remove('active');
    card.classList.add('paused');
  };

  var resume = function() {
    cards.forEach(function(c) { if (c !== card) c._stop(); });
    card.classList.remove('paused');
    card.classList.add('active');
    video.play().catch(function() {});
  };

  card._stop = stop;
  card._pause = pause;
  card._playMuted = function() { play(false); };
  setMuted(true);

  if (canHover) {
    card.addEventListener('mouseenter', function() {
      if (card.classList.contains('paused')) {
        resume();
      } else {
        play(true);
      }
    });
    card.addEventListener('mouseleave', function() {
      if (!card.classList.contains('paused')) {
        stop();
      }
    });
  }

  frame.addEventListener('click', function(e) {
    if (e.target.closest('.video-controls')) return;
    if (video.paused && !card.classList.contains('paused')) {
      play(true);
    } else if (video.paused && card.classList.contains('paused')) {
      resume();
    } else {
      pause();
    }
  });

  mute.addEventListener('click', function(e) {
    e.stopPropagation();
    setMuted(!video.muted);
  });

  slider.addEventListener('input', function(e) {
    e.stopPropagation();
    var v = +e.target.value;
    video.volume = v;
    video.muted = v === 0;
    card.classList.toggle('muted', v === 0);
    mute.innerHTML = v === 0 ? ICON_MUTED : ICON_SOUND;
    paint();
  });
});

/* ===== VISIBILITY OBSERVER ===== */
var vis = new IntersectionObserver(function(entries) {
  entries.forEach(function(en) {
    if (!en.isIntersecting) {
      en.target._stop();
    } else if (!canHover && en.intersectionRatio >= 0.6) {
      var v = en.target.querySelector('video');
      if (v && v.paused) en.target._playMuted();
    }
  });
}, { threshold: [0, 0.1, 0.6] });
cards.forEach(function(c) { vis.observe(c); });

/* ===== REVEAL ON SCROLL ===== */
var io = new IntersectionObserver(function(es) {
  es.forEach(function(e) {
    if (e.isIntersecting) {
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  });
}, { threshold: .15 });

document.querySelectorAll('.work-card, .works .section-title').forEach(function(el) {
  el.classList.add('reveal');
  io.observe(el);
});
</script>
</body>
</html>
